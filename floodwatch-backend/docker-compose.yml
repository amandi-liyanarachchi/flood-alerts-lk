services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: floodwatch
      POSTGRES_PASSWORD: floodwatch
      POSTGRES_DB: floodwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"          # handy for psql during the pilot; drop in production

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://floodwatch:floodwatch@db:5432/floodwatch
    ports:
      - "8000:8000"
    volumes:
      # Firebase service-account key, gitignored. Absent = push disabled, which
      # is a supported state: alerts still arrive by polling /alerts/active.
      - ./secrets:/srv/secrets:ro
    restart: unless-stopped

volumes:
  pgdata:
